[project]
name = "data-boss"
version = "0.1.0"
description = "Desktop app (Electron + pandas) for exploring, cleaning and visualising CSV datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.6",
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
