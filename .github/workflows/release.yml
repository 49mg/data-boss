name: Build installers

# Push a tag like v0.1.0 to build all installers and publish a GitHub Release.
# "Run workflow" in the Actions tab builds them without publishing (for testing).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            os: ubuntu-22.04 # older glibc = runs on more distros
            args: --linux
          - name: Windows (x64)
            os: windows-latest
            args: --win --x64
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --mac --arm64
          - name: macOS (Intel)
            os: macos-15-intel
            args: --mac --x64

    env:
      UV_PYTHON_DOWNLOADS: never # use the Python from setup-python
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing certificates yet

    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --frozen
          npm ci

      - name: Build data engine (PyInstaller)
        run: npm run build:backend

      - name: Build installer (electron-builder)
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            | Your computer | File |
            |---|---|
            | Windows 10/11 | `Data-Boss-*-win-x64.exe` |
            | Mac with Apple silicon (M1–M4) | `Data-Boss-*-mac-arm64.dmg` |
            | Mac with Intel chip | `Data-Boss-*-mac-x64.dmg` |
            | Ubuntu / Debian | `Data-Boss-*-linux-amd64.deb` |
            | Any other Linux | `Data-Boss-*-linux-x86_64.AppImage` |

            These builds are not code-signed yet, so your system may warn on first launch.
            See the README's "Install" section for the one-time steps.
