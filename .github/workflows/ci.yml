name: CI

on:
  push:
    branches: [main, desktop-application]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Python lint (ruff)
        run: uvx ruff check src server.py

      - name: Lockfile is up to date
        run: uv lock --check

      - name: JavaScript syntax
        run: |
          for f in electron/*.js renderer/*.js; do
            node --check "$f"
          done

      - name: Exported notebook runs in Jupyter
        run: |
          mkdir -p "$RUNNER_TEMP/nb" && cd "$RUNNER_TEMP/nb"
          cat > make_notebook.py <<'PY'
          import os, sys
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          import numpy as np, pandas as pd
          import server
          rng = np.random.default_rng(0)
          n = 120
          pd.DataFrame({
              "plan": rng.choice(["basic", "pro", None], n),
              "fee": np.where(rng.random(n) < 0.05, np.nan, rng.normal(30, 8, n).round(2)),
              "age": rng.integers(18, 60, n),
              "joined": pd.date_range("2024-01-01", periods=n).astype(str),
          }).to_csv("members.csv", index=False)
          s = server.Session()
          s.cmd_load("members.csv")
          s.cmd_clean("FILL_NA", {"columns": ["fee"], "strategy": "median"})
          s.cmd_clean("TO_DATETIME", {"columns": ["joined"]})
          s.cmd_clean("BIN", {"column": "age", "method": "quantile", "bins": "3"})
          s.cmd_clean("ONE_HOT", {"columns": ["plan"]})
          s.cmd_export("app.csv")
          charts = [{"kind": "HIST", "params": {"column": "fee"}, "title": "fee"},
                    {"kind": "LINE", "params": {"x": "joined", "y": "fee", "freq": "W"}, "title": "fee over time"}]
          with open("members_session.ipynb", "w", encoding="utf-8") as f:
              f.write(s.cmd_notebook(charts)["notebook"])
          PY
          uv run --project "$GITHUB_WORKSPACE" --frozen --with nbconvert --with ipykernel python make_notebook.py
          uv run --project "$GITHUB_WORKSPACE" --frozen --with nbconvert --with ipykernel \
            jupyter nbconvert --to notebook --execute members_session.ipynb --output executed.ipynb
          cmp members_cleaned.csv app.csv

  build:
    name: Build ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            os: ubuntu-22.04
            args: --linux
          - name: Windows (x64)
            os: windows-latest
            args: --win --x64
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --mac --arm64
          - name: macOS (Intel)
            os: macos-15-intel
            args: --mac --x64
    env:
      UV_PYTHON_DOWNLOADS: never
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v10.3.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --frozen
          npm ci

      - name: Build data engine (PyInstaller)
        run: npm run build:backend

      - name: Smoke-check the bundled engine
        shell: bash
        run: |
          printf 'city,price\nBaghdad,10\nBasra,12\nBaghdad,\n' > smoke.csv
          exe=build/pyinstaller/data-boss-backend/data-boss-backend
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          printf '%s\n' \
            '{"id":1,"cmd":"load","args":{"path":"smoke.csv"}}' \
            '{"id":2,"cmd":"inspect","args":{"kind":"QUALITY"}}' \
            '{"id":3,"cmd":"preview","args":{"method":"DROP_NA_ROWS"}}' \
            '{"id":4,"cmd":"plot","args":{"kind":"BAR","params":{"x":"city","y":"price"}}}' \
            | "$exe" > smoke-out.txt
          python - <<'PY'
          import json
          msgs = [json.loads(line) for line in open("smoke-out.txt")]
          status = {m["id"]: m["ok"] for m in msgs}
          bad = [m for m in msgs if not m["ok"]]
          assert status == {0: True, 1: True, 2: True, 3: True, 4: True}, bad or status
          print("Bundled engine OK:", sorted(status))
          PY

      - name: Build installer (electron-builder)
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Check the engine inside the packaged Mac app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d dist/mac*/"Data Boss.app" | head -1)
          echo "App: $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          exe="$app/Contents/Resources/backend/data-boss-backend"
          codesign --verify --strict --verbose=2 "$exe"
          printf '%s\n' \
            '{"id":1,"cmd":"load","args":{"path":"smoke.csv"}}' \
            '{"id":2,"cmd":"plot","args":{"kind":"BAR","params":{"x":"city","y":"price"}}}' \
            | "$exe" > app-smoke.txt
          python - <<'PY'
          import json
          msgs = [json.loads(line) for line in open("app-smoke.txt")]
          status = {m["id"]: m["ok"] for m in msgs}
          assert status == {0: True, 1: True, 2: True}, msgs
          print("Engine inside Data Boss.app OK:", sorted(status))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          retention-days: 7
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
